# Build-Konfiguration für Codemagic (macOS-Maschinen in der Cloud).
# Damit entsteht der iOS-Build ohne eigenen Mac.
#
# Vorher einmalig in der Codemagic-Oberfläche einrichten:
#   1. Repository verbinden (GitHub, GitLab, Bitbucket oder eigenes Git)
#   2. Teams → Integrations → App Store Connect: API-Schlüssel hinterlegen,
#      den Namen unten bei `app_store_connect:` eintragen
#   3. Im Apple-Developer-Portal die App-ID de.wemacon.shottimer anlegen und
#      in App Store Connect einen App-Eintrag erstellen
#   4. Für Android: Keystore unter Teams → Code signing identities hochladen
#      und den Referenznamen unten eintragen
#
# Die Signaturzertifikate erzeugt Codemagic selbst über den API-Schlüssel –
# dafür wird kein Mac und kein Keychain-Zugriff auf einem eigenen Gerät nötig.

workflows:
  ios:
    name: Shot Timer iOS
    instance_type: mac_mini_m2
    max_build_duration: 45
    integrations:
      # Name der App-Store-Connect-Integration aus Schritt 2
      app_store_connect: shot-timer-asc
    environment:
      node: 20
      xcode: latest
      ios_signing:
        distribution_type: app_store
        bundle_identifier: de.wemacon.shottimer
      vars:
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
    scripts:
      - name: Abhängigkeiten installieren
        script: npm ci
      - name: Web-Stand in das iOS-Projekt kopieren
        script: npx cap sync ios
      - name: Signaturprofile einspielen
        script: xcode-project use-profiles
      - name: Buildnummer setzen
        script: |
          cd ios/App
          agvtool new-version -all "$BUILD_NUMBER"
      - name: IPA bauen
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        # Zunächst nur nach TestFlight. Erst wenn das läuft, auf die
        # Store-Einreichung umstellen.
        submit_to_testflight: true
        submit_to_app_store: false

  android:
    name: Shot Timer Android
    instance_type: linux_x2
    max_build_duration: 30
    environment:
      node: 20
      java: 21
      android_signing:
        # Referenzname des hochgeladenen Keystores aus Schritt 4
        - shot-timer-keystore
      vars:
        PACKAGE_NAME: "de.wemacon.shottimer"
    scripts:
      - name: Abhängigkeiten installieren
        script: npm ci
      - name: Web-Stand in das Android-Projekt kopieren
        script: npx cap sync android
      - name: App Bundle bauen
        script: |
          cd android
          ./gradlew bundleRelease
    artifacts:
      - android/app/build/outputs/**/*.aab
      - android/app/build/outputs/**/mapping.txt
