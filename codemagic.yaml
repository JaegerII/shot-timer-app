# Build-Konfiguration für Codemagic (macOS-Maschinen in der Cloud).
# Damit entsteht der iOS-Build ohne eigenen Mac.
#
# VORAUSSETZUNG: kostenpflichtiges Apple Developer Program (99 EUR/Jahr).
# Der kostenlose Apple-Entwicklerzugang reicht hier NICHT. Er kann weder
# Verteilungszertifikate erzeugen noch App Store Connect, TestFlight oder
# den Store nutzen. Ohne die Mitgliedschaft schlaegt dieser Workflow beim
# Signieren fehl.
#
# Einmalig einzurichten:
#
#   Apple Developer / App Store Connect
#   1. Zertifikate, IDs & Profile → Identifiers → neue App-ID
#      de.wemacon.shottimer. Fuer das Mikrofon ist keine eigene Capability
#      noetig, der Zugriff laeuft ueber NSMicrophoneUsageDescription.
#   2. Apps → neue App anlegen. ACHTUNG: der Name im Store muss weltweit
#      eindeutig sein, "Shot Timer" ist mit hoher Wahrscheinlichkeit belegt.
#      Der Name unter dem Symbol auf dem Geraet ist davon unabhaengig und
#      steht in ios/App/App/Info.plist als CFBundleDisplayName.
#   3. Benutzer & Zugriff → Integrationen → App Store Connect API →
#      Schluessel mit Rolle "App Manager" erzeugen. Notieren: Issuer ID,
#      Key ID, und die .p8-Datei herunterladen (nur einmal moeglich).
#
#   Codemagic
#   4. Repository verbinden: JaegerII/shot-timer-app
#   5. Teams → Integrations → App Store Connect: die drei Werte aus
#      Schritt 3 hinterlegen und die Integration "shot-timer-asc" nennen
#      (oder hier unten den Namen anpassen).
#   6. Fuer Android: Keystore unter Teams → Code signing identities
#      hochladen und den Referenznamen unten eintragen.
#
# Der Android-Workflow unten haengt nicht an Apple und laeuft unabhaengig.
#
# Signaturzertifikat und Provisioning-Profil erzeugt Codemagic selbst ueber
# den API-Schluessel. Ein Mac oder Keychain-Zugriff ist dafuer nicht noetig.

workflows:
  ios:
    name: Shot Timer iOS
    instance_type: mac_mini_m2
    max_build_duration: 45
    integrations:
      # Name der App-Store-Connect-Integration aus Schritt 2
      app_store_connect: shot-timer-asc
    environment:
      node: 20
      xcode: latest
      ios_signing:
        distribution_type: app_store
        bundle_identifier: de.wemacon.shottimer
      vars:
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
    scripts:
      - name: Abhängigkeiten installieren
        script: npm ci
      - name: Web-Stand in das iOS-Projekt kopieren
        script: npx cap sync ios
      - name: Signaturprofile einspielen
        script: xcode-project use-profiles
      - name: Buildnummer setzen
        # $BUILD_NUMBER ist Codemagics eigener Zaehler und steigt je Projekt
        # monoton. Sollte TestFlight eine Nummer als belegt zurueckweisen,
        # hier einen festen Versatz addieren, z. B. $(($BUILD_NUMBER + 100)).
        # Voraussetzung ist VERSIONING_SYSTEM = apple-generic im
        # Xcode-Projekt, das ist gesetzt.
        script: |
          cd ios/App
          agvtool new-version -all "$BUILD_NUMBER"
      - name: IPA bauen
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        # Zunächst nur nach TestFlight. Erst wenn das läuft, auf die
        # Store-Einreichung umstellen.
        submit_to_testflight: true
        submit_to_app_store: false

  android:
    name: Shot Timer Android
    instance_type: linux_x2
    max_build_duration: 30
    environment:
      node: 20
      java: 21
      android_signing:
        # Referenzname des hochgeladenen Keystores aus Schritt 4
        - shot-timer-keystore
      vars:
        PACKAGE_NAME: "de.wemacon.shottimer"
    scripts:
      - name: Abhängigkeiten installieren
        script: npm ci
      - name: Web-Stand in das Android-Projekt kopieren
        script: npx cap sync android
      - name: App Bundle bauen
        script: |
          cd android
          ./gradlew bundleRelease
    artifacts:
      - android/app/build/outputs/**/*.aab
      - android/app/build/outputs/**/mapping.txt
