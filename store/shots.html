<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=440">
<title>Store-Screenshots</title>
<!--
  Vorlage für die App-Store-Bilder. tools/store-shots.mjs öffnet sie mit
  ?shot=1..5&lang=de|en und fotografiert sie in 1320 x 2868 (440 x 956 bei 3x).
  Die App läuft echt im iPhone-Rahmen; nur Zeiten und Zustände werden für das
  Motiv gesetzt.
-->
<style>
  @font-face{font-family:Montserrat;src:url(../dist/assets/fonts/montserrat-latin.woff2) format('woff2');font-weight:100 900}
  @font-face{font-family:Montserrat;src:url(../dist/assets/fonts/montserrat-latin-ext.woff2) format('woff2');font-weight:100 900;unicode-range:U+0100-024F,U+1E00-1EFF}
  html,body{margin:0;width:440px;height:956px;overflow:hidden}
  body{background:url(../dist/assets/topo.svg) 0 0/520px 520px repeat,radial-gradient(circle at 50% 30%,#1b1f1d 0,#0b0c0c 75%);color:#edede6;font-family:Montserrat,system-ui,sans-serif;position:relative}
  .head{position:absolute;left:0;right:0;top:64px;text-align:center;padding:0 28px}
  .kicker{font-size:11px;font-weight:800;letter-spacing:.28em;color:#18e5ff;margin-bottom:12px}
  h1{margin:0;font-size:33px;line-height:1.12;font-weight:900;letter-spacing:-.01em}
  h1 em{font-style:normal;color:#18e5ff}
  .sub{margin:12px auto 0;max-width:330px;font-size:14px;line-height:1.45;color:#a7ab9e;font-weight:600}
  .phone{position:absolute;left:50%;top:268px;width:342px;height:740px;transform:translateX(-50%);border-radius:56px;background:#1d2120;padding:10px;box-shadow:0 0 0 2px #2f3533,0 40px 90px #000c,0 0 120px #18e5ff14}
  .screen{position:relative;width:100%;height:100%;border-radius:47px;overflow:hidden;background:#0f1010}
  /* Bildschirm ist 342 x 740 px; die App rendert in 390 x 844 (iPhone-Größe) und wird passend verkleinert. */
  .screen iframe{border:0;width:390px;height:844px;transform:scale(.87693);transform-origin:0 0;display:block}
  .island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:96px;height:28px;border-radius:20px;background:#000;z-index:5}
  /* Statusleiste wie auf dem iPhone; die App bekommt darunter Platz (Safe Area). */
  .status{position:absolute;top:15px;left:0;right:0;z-index:4;display:flex;justify-content:space-between;padding:0 30px 0 34px;font-size:13px;font-weight:700;color:#fff}
  .status i{display:inline-flex;gap:5px;align-items:center;font-style:normal}
  .bat{width:22px;height:11px;border:1.5px solid #fff;border-radius:3px;position:relative;opacity:.95}
  .bat::after{content:"";position:absolute;inset:1.5px;right:4px;background:#fff;border-radius:1px}
</style>
</head>
<body>
  <div class="head">
    <div class="kicker">FORTH TRACE SHOT TIMER</div>
    <h1 id="title"></h1>
    <p class="sub" id="sub"></p>
  </div>
  <div class="phone"><div class="screen"><div class="island"></div><div class="status"><span>9:41</span><i><svg width="17" height="11" viewBox="0 0 17 11" fill="#fff"><rect x="0" y="7" width="3" height="4" rx="1"/><rect x="4.5" y="5" width="3" height="6" rx="1"/><rect x="9" y="2.5" width="3" height="8.5" rx="1"/><rect x="13.5" y="0" width="3" height="11" rx="1"/></svg><span class="bat"></span></i></div><iframe id="app" title="App" scrolling="no"></iframe></div></div>

<script>
  const q = new URLSearchParams(location.search);
  const SHOT = Number(q.get('shot') || 1);
  const LANG = q.get('lang') || 'de';

  // Reihenfolge der Motive im Store. Überschriften immer auf Englisch.
  const MOTIFS = [
    ['go', 'Every shot.<br><em>Every split.</em>', 'Draw, splits and total time via the microphone – at the range or at home.'],
    ['dry', 'Live fire <em>&amp;</em><br><em>dry fire</em>', 'Separate detection for loud shots and quiet trigger clicks. Standby, then the beep.'],
    ['par', 'Par time<br>you can <em>see</em>', 'Double beep and a red edge as soon as you are over time.'],
    ['match', 'Matches with<br><em>overall results</em>', 'As many stages as you like, Hit Factor and match points for every shooter.'],
    ['stage', 'Hit Factor<br><em>live</em> at the range', 'Enter time and hit zones – the results update instantly.'],
    ['history', 'Your training<br><em>history</em>', 'Every run is saved. No account, everything stays on your iPhone.']
  ];
  const [KEY, TITLE, SUB] = MOTIFS[SHOT - 1];
  document.getElementById('title').innerHTML = TITLE;
  document.getElementById('sub').textContent = SUB;
  /* ---------- Beispieldaten im Speicher der App ---------- */
  const day = (d, h) => new Date(Date.now() - d * 864e5 - h * 36e5).toISOString();
  const entry = (n, pf, time, a, c, d, m) => ({ id: n + Math.random().toString(36).slice(2, 6), shooterId: 's-' + n, name: n, pf, time, a, c, d, m, ns: 0, pe: 0 });
  const NAMES = ['Alex', 'Jonas', 'Sarah', 'Tim'];
  const matches = [{
    id: 'm1', name: LANG === 'de' ? 'Vereinsmeisterschaft' : 'Club Championship', at: day(0, 2), stages: [
      { id: 'st1', name: LANG === 'de' ? 'Stage 1 – Speed' : 'Stage 1 – Speed', shots: 12, entries: [entry('Alex', 'minor', 9.84, 10, 2, 0, 0), entry('Jonas', 'major', 11.2, 9, 3, 0, 0), entry('Sarah', 'minor', 10.05, 11, 1, 0, 0), entry('Tim', 'minor', 13.4, 8, 3, 1, 0)] },
      { id: 'st2', name: LANG === 'de' ? 'Stage 2 – Movement' : 'Stage 2 – Movement', shots: 16, entries: [entry('Alex', 'minor', 15.6, 13, 3, 0, 0), entry('Jonas', 'major', 14.9, 12, 3, 1, 0), entry('Sarah', 'minor', 16.8, 15, 1, 0, 0), entry('Tim', 'minor', 18.2, 11, 4, 0, 1)] },
      { id: 'st3', name: LANG === 'de' ? 'Stage 3 – Classic' : 'Stage 3 – Classic', shots: 8, entries: [entry('Alex', 'minor', 6.1, 7, 1, 0, 0), entry('Jonas', 'major', 6.8, 6, 2, 0, 0), entry('Sarah', 'minor', 5.9, 7, 1, 0, 0), entry('Tim', 'minor', 7.4, 6, 1, 1, 0)] }
    ]
  }, {
    id: 'm2', name: LANG === 'de' ? 'Training Dienstag' : 'Tuesday practice', at: day(4, 1), stages: [
      { id: 'st4', name: '', shots: 10, entries: [entry('Alex', 'minor', 7.9, 8, 2, 0, 0), entry('Sarah', 'minor', 8.4, 9, 1, 0, 0)] }
    ]
  }];
  const runs = [[0, 3, 'live', 2.31, 6, 1.08, .19], [0, 5, 'dry', 1.62, 4, .94, .21], [1, 2, 'live', 3.05, 8, 1.21, .18], [2, 4, 'live', 2.47, 6, 1.15, .2], [3, 1, 'dry', 1.88, 5, .99, .22], [5, 3, 'live', 2.74, 6, 1.19, .23]]
    .map(([d, h, mode, total, count, first, best], i) => ({ id: 'r' + i, at: day(d, h), mode, par: 0, delay: 'random', total, count, first, best, shots: [] }));
  localStorage.setItem('shot-timer-settings-v1', JSON.stringify({ lang: LANG, langChosen: true, theme: 'dark', mode: KEY === 'dry' ? 'dry' : 'live', delay: 'random', delayRandom: true, par: KEY === 'par' ? 3 : 0, reps: 1, volume: .65, vibration: true, drySeen: true }));
  localStorage.setItem('shot-timer-matches-v1', JSON.stringify(matches));
  localStorage.setItem('shot-timer-history-v2', JSON.stringify(runs));
  localStorage.setItem('shot-timer-shooters-v1', JSON.stringify(NAMES.map(n => ({ id: 's-' + n, name: n, pf: n === 'Jonas' ? 'major' : 'minor' }))));
  sessionStorage.setItem('introDone', '1');

  /* ---------- Motiv in der App einstellen ---------- */
  const frame = document.getElementById('app');
  frame.src = '../dist/index.html';
  const wait = (ms) => new Promise(r => setTimeout(r, ms));
  frame.onload = async () => {
    const w = frame.contentWindow, d = frame.contentDocument;
    const $ = (s) => d.querySelector(s);
    const tr = (k) => (w.I18N && w.I18N[LANG] && w.I18N[LANG][k]) || k;
    // Safe Area wie auf dem iPhone nachbilden und Scrollleisten unterdrücken.
    const st = d.createElement('style');
    st.textContent = 'html,body{overflow:hidden!important}::-webkit-scrollbar{display:none}.app{padding-top:54px!important}';
    d.head.appendChild(st);
    const dec = LANG === 'de' ? ',' : '.';
    const num = (v) => v.toFixed(2).replace('.', dec);
    const timer = (t, run, label, splits) => {
      d.documentElement.dataset.run = run;
      $('#stateLabel').textContent = label;
      $('#seconds').textContent = Math.floor(t);
      $('#hundredths').textContent = '.' + String(Math.round((t % 1) * 100)).padStart(2, '0');
      $('#startBtn').textContent = tr('STOP');
      $('#startBtn').classList.add('stop');
      const shown = splits.map((s, i) => ({ s, n: i + 1 })).slice(-4).reverse();
      $('#splitStrip').innerHTML = shown.map(x => '<span class="chip' + (x.n === 1 ? ' first' : '') + '"><small>#' + String(x.n).padStart(2, '0') + '</small><b>' + (x.n === 1 ? x.s.toFixed(2) : '+' + x.s.toFixed(2)) + '</b></span>').join('');
      $('#lastSplit').innerHTML = tr('Split') + ' <strong>' + num(splits[splits.length - 1]) + ' s</strong>';
    };
    await wait(400);
    if (KEY === 'go') timer(1.84, 'go', tr('GO'), [1.12, .24, .22, .26]);
    if (KEY === 'dry') {
      // Standby im Dry-Fire-Modus: gelber Rand, Zeit steht noch auf null.
      d.documentElement.dataset.run = 'standby';
      $('#stateLabel').textContent = tr('STANDBY');
      $('#startBtn').textContent = tr('STOP');
      $('#startBtn').classList.add('stop');
    }
    if (KEY === 'par') timer(3.27, 'par', tr('NACH PAR'), [1.18, .27, .31, .29, .41, .35, .46]);
    if (KEY === 'match') {
      $('#scoreBtn').click(); await wait(150); $('[data-match="m1"]').click(); await wait(150);
      // Die Gesamtwertung ist das Motiv: ganz nach unten scrollen.
      const sc = $('#matchPage .score-scroll'); sc.scrollTop = sc.scrollHeight;
    }
    if (KEY === 'stage') { $('#scoreBtn').click(); await wait(150); $('[data-match="m1"]').click(); await wait(150); $('[data-stage="st2"]').click(); }
    if (KEY === 'history') $('#historyBtn').click();
    await wait(500);
    await d.fonts.ready;
    window.READY = true;
  };
</script>
</body>
</html>
