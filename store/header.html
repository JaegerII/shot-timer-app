<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Store-Kopfzeile</title>
<!--
  Kopfzeile für die App-Store-Produktseite. tools/store-header.mjs fotografiert
  sie in 3840 x 1646 (?format=wide) und 5244 x 2950 (?format=tall).
  Die drei iPhones sind store/shots.html im Modus bare=1, nacheinander geladen,
  weil sie sich den Speicher der App teilen.
-->
<style>
  @font-face{font-family:Montserrat;src:url(../dist/assets/fonts/montserrat-latin.woff2) format('woff2');font-weight:100 900}
  html,body{margin:0;overflow:hidden}
  body{width:var(--w);height:var(--h);position:relative;background:url(../dist/assets/topo.svg) 0 0/620px 620px repeat,radial-gradient(circle at 72% 50%,#1b201e 0,#0b0c0c 70%);color:#edede6;font-family:Montserrat,system-ui,sans-serif}
  .text{position:absolute;left:var(--pad);top:50%;transform:translateY(-50%);width:var(--textw)}
  .icon{width:calc(var(--u)*13);height:calc(var(--u)*13);border-radius:calc(var(--u)*3);background:#1c1f1d;border:1px solid #ffffff14;display:grid;place-items:center;color:#fff;margin-bottom:calc(var(--u)*5)}
  .kicker{font-size:calc(var(--u)*2.1);font-weight:800;letter-spacing:.3em;color:#18e5ff;margin-bottom:calc(var(--u)*2.4)}
  h1{margin:0;font-size:calc(var(--u)*7.6);line-height:1.05;font-weight:900;letter-spacing:-.015em}
  h1 em{font-style:normal;color:#18e5ff}
  p{margin:calc(var(--u)*3) 0 0;font-size:calc(var(--u)*2.5);line-height:1.45;color:#a7ab9e;font-weight:600;max-width:calc(var(--u)*62)}
  .phones{position:absolute;right:var(--pad);top:50%;width:calc(440px * 3 * var(--s) - 90px * var(--s) * 2);height:calc(780px * var(--s));transform:translateY(-50%)}
  .phones iframe{position:absolute;top:0;border:0;width:440px;height:780px;transform-origin:0 0;background:transparent}
</style>
</head>
<body>
  <div class="text">
    <div class="icon" id="icon"></div>
    <div class="kicker">SHOT TIMER · LIVE FIRE · DRY FIRE</div>
    <h1>FORTH TRACE<br><em>Shot Timer</em></h1>
    <p>Every shot, every split – timed with your iPhone's microphone. Par time, Hit Factor and full match results.</p>
  </div>
  <div class="phones" id="phones"></div>
<script>
  const FORMAT = new URLSearchParams(location.search).get('format') || 'wide';
  // CSS-Pixel; der Generator fotografiert mit Faktor 2.
  // u = Grundeinheit für Schrift und Abstände; im hohen Format kleiner, damit Text und iPhones nebeneinander passen.
  const F = FORMAT === 'tall' ? { w: 2622, h: 1475, s: 1.25, pad: 150, textw: 860, u: 11 }
    : FORMAT === 'play' ? { w: 1024, h: 500, s: .56, pad: 52, textw: 400, u: 4.6 }
    : { w: 1920, h: 823, s: .98, pad: 110, textw: 760, u: 8.23 };
  // Google Play: Vorstellungsgrafik ohne iPhone-Bezug.
  if (FORMAT === 'play') document.querySelector('.text p').textContent = "Every shot, every split – timed with your phone's microphone. Par time, Hit Factor, match results and your stage video.";
  const root = document.documentElement.style;
  root.setProperty('--w', F.w + 'px'); root.setProperty('--h', F.h + 'px');
  root.setProperty('--s', F.s); root.setProperty('--pad', F.pad + 'px'); root.setProperty('--textw', F.textw + 'px');
  root.setProperty('--u', F.u + 'px');

  // App-Icon aus der Kopfzeile der App übernehmen (gleiches SVG).
  fetch('../dist/index.html').then(r => r.text()).then(html => {
    const m = html.match(/<div class="brand-mark" aria-hidden="true">(<svg[\s\S]*?<\/svg>)<\/div>/);
    if (m) document.getElementById('icon').innerHTML = m[1].replace('width="24" height="24"', 'width="70%" height="70%"');
  });

  // Video (?anim=1): alle drei laufen denselben Ablauf, zeitversetzt (off in Sekunden).
  const ANIM = new URLSearchParams(location.search).get('anim') === '1';
  // Reihenfolge links → rechts: Standby, läuft, Par. Die mittlere liegt vorn.
  const SHOTS = FORMAT === 'play'
    // Google Play: in der Mitte der Video-Editor mit erkannten Schüssen, daneben Timer (läuft) und Par.
    ? [{ shot: 1, x: 0, z: 1, off: 0 }, { shot: 7, x: 1, z: 3, off: 0 }, { shot: 3, x: 2, z: 2, off: 0 }]
    : [{ shot: 2, x: 0, z: 1, off: 0, extra: '&mode=dry' }, { shot: 1, x: 1, z: 3, off: 2.2 }, { shot: 3, x: 2, z: 2, off: 4.9 }];

  /* Ablauf eines Durchgangs, Schleife von LOOP Sekunden:
     Standby (gelb) → Signal → Zeit läuft (grün) → Par 3,00 s (rot) → Ende. */
  const LOOP = 8, STANDBY = 1.5, PAR = 3, STOP_AT = 4.6;
  const HITS = [1.12, 1.36, 1.58, 1.84, 2.21, 2.47, 2.78, 3.27, 3.52, 3.94, 4.31];
  const pulse = (u, period) => 1 - .28 * (.5 - .5 * Math.cos(2 * Math.PI * u / period));
  function stateAt(t) {
    const u = ((t % LOOP) + LOOP) % LOOP;
    if (u < STANDBY) return { run: 'standby', time: 0, shots: [], glow: pulse(u, 1.2) };
    const el = u - STANDBY;
    if (el < STOP_AT) {
      const run = el < PAR ? 'go' : 'par';
      return { run, time: el, shots: HITS.filter(h => h <= el), glow: pulse(el, run === 'go' ? 1.6 : .8) };
    }
    return { run: 'end', time: HITS[HITS.length - 1], shots: HITS, glow: 0 };
  }
  window.renderAt = (t) => {
    document.querySelectorAll('#phones iframe').forEach((f, i) => {
      const app = f.contentWindow;
      if (app && app.SET) app.SET(stateAt(t + SHOTS[i].off));
    });
  };
  const step = (440 - 90) * F.s;
  (async () => {
    for (const p of SHOTS) {
      const f = document.createElement('iframe');
      f.style.left = (p.x * step) + 'px';
      f.style.zIndex = p.z;
      f.style.transform = 'scale(' + F.s + ')' + (p.x === 1 ? '' : ' translateY(' + 30 + 'px)');
      f.src = 'shots.html?bare=1&lang=en&shot=' + p.shot + (FORMAT === 'play' ? '&play=1' : '') + (ANIM ? '&anim=1&par=3' + (p.extra || '') : '');
      document.getElementById('phones').appendChild(f);
      await new Promise(res => { const t = setInterval(() => { if (f.contentWindow && f.contentWindow.READY) { clearInterval(t); res(); } }, 100); });
    }
    await document.fonts.ready;
    if (ANIM) window.renderAt(0);
    window.READY = true;
  })();
</script>
</body>
</html>
